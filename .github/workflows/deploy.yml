# Copy site/ to chap-sandbox, the NREC host behind https://chap-sandbox.dhis2.org/,
# where it is the front page. The server is described in dhis2-chap/climate-sre
# under hosts/chap-sandbox/.
#
# The copy is the shared action in .github/actions/deploy (the same one other
# repositories use for their own directories). This repository's key, the
# CHAP_SANDBOX_SSH_KEY secret, is forced through rrsync into
# /mnt/data/www/front-page: it can overwrite that directory and nothing else.
# The root index.html on the server is a symlink into that directory.

name: Deploy to chap-sandbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chap-sandbox-front-page
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/deploy
        with:
          ssh-key: ${{ secrets.CHAP_SANDBOX_SSH_KEY }}
          dir: site
          path: /
