# Copy site/ to chap-sandbox, the NREC host behind https://chap-sandbox.dhis2.org/,
# where it is the front page. The server is described in dhis2-chap/climate-sre
# under hosts/chap-sandbox/.
#
# The copy is rsync over SSH as the server's `deploy` account, with a key of its
# own (the CHAP_SANDBOX_SSH_KEY secret) forced through rrsync into
# /mnt/data/www/front-page: the key can overwrite that directory and nothing
# else. The root index.html on the server is a symlink into that directory.
# The server's host key is pinned below.

name: Deploy to chap-sandbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chap-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Copy site/ to the server
        env:
          SSH_KEY: ${{ secrets.CHAP_SANDBOX_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo '158.39.75.126 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL3q+49ScHeF+of+0SfLQf7WBmxEPIVraSPCfkfIM8cJ' > ~/.ssh/known_hosts
          rsync -az --delete --info=stats1 -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes' site/ deploy@158.39.75.126:/
          echo 'https://chap-sandbox.dhis2.org/'
