<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chap sandbox</title>
  <meta name="description" content="Experimental Chap material under development: slides, demos, learning material and more.">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2933;
      --muted: #52606d;
      --box: #0b5fa5;
      --box-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --fg: #e6ebf0;
        --muted: #9aa5b1;
        --box: #1f6fb8;
        --box-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 4rem 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 { font-size: 2rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 2rem; color: var(--muted); }
    .box {
      display: block;
      background: var(--box);
      color: var(--box-fg);
      text-decoration: none;
      border-radius: 12px;
      padding: 2rem;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    .box:hover, .box:focus { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main>
    <h1>Chap sandbox</h1>
    <p>chap-sandbox contains experimental stuff under development: slides, demos, learning material and more.</p>
    <a class="box" href="/learning-material/">Learning material</a>
  </main>
</body>
</html>
